<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Adventurer's Pack (live)</title>
<style>
:root{--bg:#f6f1e7;--card:#fffaf0;--ink:#2b2118;--mute:#7a6a58;--line:#d9ccb4;--accent:#8b2e2e;--gold:#b8860b}
@media (prefers-color-scheme:dark){:root{--bg:#1c1712;--card:#2a221a;--ink:#f0e6d2;--mute:#a89880;--line:#4a3d2f;--accent:#e0705f;--gold:#e3b341}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--pt,var(--ink));font-family:Georgia,'Times New Roman',serif}
main{position:relative;z-index:1;padding:20px 32px 26px}
.col{max-width:1240px;margin:0 auto}
h1{margin:0 0 4px;font-size:1.7rem;color:var(--pa,var(--accent))}
.sub{color:var(--pm,var(--mute));margin:0 0 16px;font-size:.9rem}
.search{position:relative}
input{width:100%;padding:12px 14px;font:inherit;font-size:1rem;border:2px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink)}
input:focus{outline:none;border-color:var(--accent)}
.results{color:var(--ink);position:absolute;left:0;right:0;top:100%;margin-top:4px;background:var(--card);border:1px solid var(--line);border-radius:10px;z-index:50;max-height:340px;overflow-y:auto;box-shadow:0 8px 24px rgba(0,0,0,.2)}
.row{display:flex;justify-content:space-between;gap:10px;padding:10px 14px;cursor:pointer;border-bottom:1px solid var(--line)}
.row:last-child{border:0}.row:hover{background:var(--bg)}
.row small,.msg{color:var(--mute)}.msg{padding:10px 14px}
.bar{min-height:1.5em;display:flex;justify-content:space-between;margin:22px 0 8px;color:var(--pm,var(--mute));font-size:.9rem}
.grid{position:relative;width:100%;margin-top:6px;touch-action:none;user-select:none;-webkit-user-select:none}
.slot{position:absolute;left:0;top:0;pointer-events:none;will-change:transform}
.slot.hot{z-index:5}
.slot::after{content:"";position:absolute;left:14%;right:14%;bottom:0;height:calc(var(--h,90px)*.07 + 3px);border-radius:50%;background:radial-gradient(closest-side,rgba(0,0,0,.38),transparent);animation:shade var(--d,4s) ease-in-out infinite;animation-delay:var(--dl,0s)}
.fl{position:absolute;inset:0 0 18px 0;display:flex;align-items:center;justify-content:center;animation:float var(--d,4s) ease-in-out var(--dl,0s) infinite,drift var(--d2,9s) ease-in-out var(--dl2,0s) infinite}
.fl img{width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 5px 5px rgba(0,0,0,.35));transition:transform .2s}
.slot.box .fl img{object-fit:cover;border-radius:10px}
.slot.hot .fl,.slot.sel .fl,.slot.still .fl{animation-play-state:paused}
.slot.hot img,.slot.sel img{filter:drop-shadow(1.5px 0 0 var(--gold)) drop-shadow(-1.5px 0 0 var(--gold)) drop-shadow(0 1.5px 0 var(--gold)) drop-shadow(0 -1.5px 0 var(--gold)) drop-shadow(0 6px 6px rgba(0,0,0,.35))}
.mono{width:100%;height:100%;border:2px dashed var(--pm,var(--line));border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:2rem;color:var(--pm,var(--mute))}
.qty{position:absolute;right:-6px;bottom:-2px;font-size:.75rem;font-weight:bold;background:var(--accent);color:#fff;border-radius:8px;padding:0 6px;z-index:2}
@keyframes float{0%,100%{transform:translateY(0) rotate(-.8deg)}50%{transform:translateY(calc(var(--h,90px)*-.06)) rotate(.8deg)}}
@keyframes drift{0%,100%{translate:0 0}33%{translate:calc(var(--h,90px)*.035) calc(var(--h,90px)*-.025)}66%{translate:calc(var(--h,90px)*-.03) calc(var(--h,90px)*.02)}}
@keyframes shade{0%,100%{transform:scale(1);opacity:.9}50%{transform:scale(.75);opacity:.5}}
@media (prefers-reduced-motion:reduce){.fl,.slot::after{animation:none}}
.empty{color:var(--pm,var(--mute));font-style:italic}
.catmark{position:absolute;width:11px;height:11px;margin:-5.5px;border-radius:50%;background:var(--gold);opacity:0;transition:opacity .6s ease;pointer-events:auto;cursor:default}
.catmark.show{opacity:.85}
.catmark:hover{opacity:1}
.tip{color:var(--ink);position:fixed;z-index:20;pointer-events:none;max-width:280px;background:var(--card);border:2px solid var(--gold);border-radius:10px;padding:10px 12px;box-shadow:0 8px 24px rgba(0,0,0,.3);font-size:.85rem;display:none}
.tip h3,.detail h2{margin:0 0 6px;color:var(--accent)}
.stat{display:flex;justify-content:space-between;gap:12px;border-bottom:1px dotted var(--line);padding:2px 0}
.stat span:first-child{color:var(--mute);white-space:nowrap}.stat span:last-child{text-align:right}
.detail{color:var(--ink);display:none;position:fixed;z-index:30;width:300px;max-height:calc(100vh - 20px);overflow:auto;background:var(--card);border:2px solid var(--gold);border-radius:12px;padding:14px 16px;box-shadow:0 12px 32px rgba(0,0,0,.35);transition:left .22s ease,top .22s ease}
.detail.pop{animation:pop .24s cubic-bezier(.2,1.4,.4,1)}
@keyframes pop{from{opacity:0;transform:scale(.85)}to{opacity:1;transform:scale(1)}}
.dh{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.ph0{color:var(--mute);text-align:center;padding:60px 0;font-style:italic}.dimg{text-align:center;margin-bottom:6px}
.ph1{width:160px;height:160px;border:1px dashed var(--line);border-radius:10px;display:inline-flex;align-items:center;justify-content:center;color:var(--mute)}
.dwrap{display:flex;gap:16px;flex-wrap:wrap}.dwrap>div{flex:1;min-width:220px}
.big{max-width:100%;max-height:170px;width:auto;height:auto;object-fit:contain;filter:drop-shadow(0 5px 6px rgba(0,0,0,.35))}.big.rnd{border-radius:10px}
.credit{font-size:.75rem;color:var(--mute);margin:4px 0 10px;text-align:center}.credit a{color:var(--mute)}
.desc{font-size:.85rem;color:var(--mute);margin-top:8px}
.btns{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
button{font:inherit;padding:7px 14px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink);cursor:pointer}
button.danger{color:var(--accent);border-color:var(--accent)}
.linkrow{margin-top:10px}.linkrow input{padding:8px 10px;font-size:.9rem}.note{font-size:.8rem;color:var(--mute);margin-top:6px;min-height:1em}
.ph{grid-column:1/-1;font-size:.8rem;margin-top:6px}
.pick{display:grid;grid-template-columns:repeat(auto-fill,96px);gap:10px;margin-top:8px;color:var(--mute)}
.pi{position:relative;width:96px;height:96px;cursor:pointer;border:2px solid var(--line);border-radius:8px;overflow:hidden;background:conic-gradient(rgba(128,128,128,.18) 25%,transparent 0 50%,rgba(128,128,128,.18) 0 75%,transparent 0) 0 0/16px 16px}
.pi:hover{border-color:var(--gold)}
.pi img{width:100%;height:100%;object-fit:contain;display:block}
.pi b{position:absolute;right:3px;bottom:3px;font:700 8px/1 system-ui,sans-serif;letter-spacing:.4px;background:rgba(0,0,0,.72);color:#fff;padding:2px 3px;border-radius:3px}
#modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:40;align-items:center;justify-content:center;padding:20px}
.mbox{color:var(--ink);background:var(--card);border:2px solid var(--gold);border-radius:14px;max-width:880px;width:100%;max-height:85vh;overflow:auto;padding:16px}
.mh{display:flex;justify-content:space-between;align-items:center;color:var(--accent)}
.tools{position:relative;display:flex;gap:8px;margin-bottom:10px}.tools button{font-size:.85rem;padding:5px 14px}
.impmsg{color:var(--ink);display:none;position:absolute;left:0;top:calc(100% + 6px);z-index:60;background:var(--card);border:2px solid var(--gold);border-radius:10px;padding:10px 14px;box-shadow:0 8px 24px rgba(0,0,0,.25);font-size:.9rem;max-width:360px;width:max-content}
.impmsg .btns{margin-top:8px}
#bgfx,#frame{position:fixed;inset:0;pointer-events:none;z-index:0}
.spacer{flex:1}.tools button{background:var(--card);color:var(--ink)}
#undo,#redo{width:38px;padding:5px 0;font-size:1.05rem}
#undo:disabled,#redo:disabled{opacity:.35;cursor:default}
.apwrap{position:absolute;right:0;bottom:calc(100% + 8px);z-index:10;display:flex;gap:8px}
.shell{display:flex;gap:18px;align-items:flex-start}.stage{flex:1;min-width:0}
.bar{max-width:1240px;margin-left:auto;margin-right:auto}
.titlebar{display:flex;align-items:center;gap:12px;margin:0 0 4px}.titlebar h1{margin:0}
.chwrap{position:relative;flex:none}
.round{width:42px;height:42px;padding:0;border-radius:50%;background:var(--card);color:var(--ink);border:2px solid var(--gold);font-weight:bold;font-size:1.1rem;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 8px rgba(0,0,0,.22);transition:transform .2s}
.round:hover{transform:scale(1.08)}
.chmenu{position:absolute;left:0;top:calc(100% + 8px);z-index:60;min-width:220px;background:var(--card);color:var(--ink);border:2px solid var(--gold);border-radius:14px;padding:8px;box-shadow:0 10px 28px rgba(0,0,0,.3);transform-origin:21px -8px;transform:scale(.4);opacity:0;pointer-events:none;transition:transform .2s cubic-bezier(.2,1.3,.4,1),opacity .15s}
.chmenu.open{transform:scale(1);opacity:1;pointer-events:auto}
.ch{display:flex;justify-content:space-between;align-items:center;gap:8px;border:1px solid transparent;border-radius:9px;padding:8px 10px;margin-bottom:4px;cursor:pointer;font-size:.95rem}
.ch:hover{background:rgba(128,128,128,.14)}.ch.on{border-color:var(--gold);font-weight:bold}
.cn{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.ci{opacity:.55;padding:0 3px;font-weight:normal}.ci:hover{opacity:1}
.addch{width:100%;border-style:dashed;font-size:.88rem;padding:7px 8px;margin-top:2px}
.chin{padding:8px 10px;font-size:.9rem;margin-bottom:4px}
.cprow{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.cprow select{flex:1;min-width:110px;font:inherit;font-size:.85rem;padding:5px 8px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink)}
.hint{font-size:.8rem;color:var(--mute)}
.appear{display:none;position:absolute;right:0;top:calc(100% + 6px);z-index:60;width:336px;background:var(--card);color:var(--ink);border:2px solid var(--gold);border-radius:12px;padding:12px 14px;box-shadow:0 10px 28px rgba(0,0,0,.3);font-size:.88rem}
.ap-row{margin-bottom:12px}.ap-row>b{display:block;margin-bottom:6px;font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--mute)}
.sw{display:flex;flex-wrap:wrap;gap:7px}
.swc{position:relative;width:26px;height:26px;padding:0;border-radius:50%;border:2px solid rgba(0,0,0,.2);cursor:pointer;overflow:hidden;display:inline-block}
.swc.on{box-shadow:0 0 0 2px var(--card),0 0 0 4px var(--gold)}
.round.on{box-shadow:0 0 0 2px var(--gold) inset}
.swc input{position:absolute;inset:0;width:100%;height:100%;opacity:0;padding:0;border:0;cursor:pointer}
.chips{display:flex;flex-wrap:wrap;gap:6px}.chip{padding:4px 11px;font-size:.8rem;border-radius:999px}.chip.on{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold) inset}
.tg{display:flex;align-items:center;gap:8px;cursor:pointer}.tg input{width:auto;padding:0;accent-color:var(--gold)}
#dropov{display:none;position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.5);align-items:center;justify-content:center;pointer-events:none}
#dropov.on{display:flex}
#dropov::before{content:"";position:absolute;inset:18px;border:3px dashed rgba(255,255,255,.85);border-radius:26px}
.dropbox{position:relative;color:#fff;font-size:2.2rem;letter-spacing:.02em;text-shadow:0 2px 12px rgba(0,0,0,.5)}
</style>
</head>
<body>
<div id="bgfx"></div><div id="frame"></div>
<main>
<div class="col">
<div class="tools"><button id="undo" title="Undo" disabled>↺</button><button id="redo" title="Redo" disabled>↻</button><button id="exp" title="Download this character's pack as a JSON file">Export</button><button id="imp" title="Load a previously exported JSON file">Import</button><input type="file" id="file" accept=".json,application/json" hidden><div id="impmsg" class="impmsg"></div></div>
<div class="titlebar"><div id="chwrap" class="chwrap"><button id="chb" class="round" aria-label="Characters"></button><div id="chmenu" class="chmenu"></div></div><h1 id="ttl">Adventurer's Pack</h1></div>
<p class="sub">Live data from dnd5eapi.co · images from D&D wikis, Openverse (CC) and Wikimedia Commons</p>
<div class="search"><div class="apwrap"><button id="srt" class="round" title="Free float (click to sort)" aria-label="Sort"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M6 6h9M6 12h6M6 18h3"/><path d="M17 15l3 3 3-3M20 4v14"/></svg></button><button id="apb" class="round" title="Appearance" aria-label="Appearance"><svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a9 9 0 1 0 9 9c0-1.1-.5-2-2-2h-2.6c-1 0-1.8-.8-1.8-1.8 0-.5.2-1 .5-1.3.5-.5.8-1.1.8-1.9C15.9 3.9 14.2 3 12 3Z"/><circle cx="7.6" cy="10.6" r="1.05" fill="currentColor" stroke="none"/><circle cx="9.1" cy="15" r="1.05" fill="currentColor" stroke="none"/><circle cx="13.6" cy="16.4" r="1.05" fill="currentColor" stroke="none"/><circle cx="16" cy="12" r="1.05" fill="currentColor" stroke="none"/></svg></button><div id="appear" class="appear"></div></div><input id="q" placeholder="Search items… try “greatsword”" autocomplete="off"><div id="res" class="results" hidden></div></div>
</div>
<div class="shell"><div class="stage"><div class="bar"><span id="count"></span><span id="wt"></span></div><div id="grid" class="grid"></div></div></div>
<div id="detail" class="detail"></div>
</main>
<div id="tip" class="tip"></div>
<div id="modal"></div>
<div id="dropov"><div class="dropbox">Load inventory</div></div>
<script>
const API='https://www.dnd5eapi.co', $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
async function j(u,ms=9000){
  const c=new AbortController(),t=setTimeout(()=>c.abort(),ms);
  try{const r=await fetch(u,{signal:c.signal});if(!r.ok)throw new Error('HTTP '+r.status);return await r.json()}
  catch(e){throw new Error(e&&e.name==='AbortError'?'timed out':/Failed to fetch|NetworkError|Load failed/i.test((e&&e.message)||'')?'blocked or unreachable':(e&&e.message)||'error')}
  finally{clearTimeout(t)}
}
let sel=null,pickOpen=false,cand={};
const uid=()=>Math.random().toString(36).slice(2,9),KEY='dnd-pack-v2',DEF_THEME={bg:'',grad:true,tex:'none',frame:'none'};
function cleanTheme(t){
  t=t&&typeof t==='object'?t:{};
  return{bg:/^#[0-9a-f]{6}$/i.test(t.bg||'')?String(t.bg).toLowerCase():'',grad:typeof t.grad==='boolean'?t.grad:DEF_THEME.grad,
    tex:['none','paper','parchment','linen','graph'].includes(t.tex)?t.tex:'none',frame:['none','line','broken','wavy'].includes(t.frame)?t.frame:'none'};
}
function loadState(){
  let st=null;try{st=JSON.parse(localStorage.getItem(KEY)||'null')}catch(e){}
  if(!st||!Array.isArray(st.chars)||!st.chars.length){
    let old=[];try{old=JSON.parse(localStorage.getItem('dnd-inv-live')||'[]')}catch(e){}   // carry over the single-pack version
    st={chars:[{id:uid(),name:'Adventurer',items:Array.isArray(old)?old:[]}],cur:null};
  }
  const lg=st.theme&&typeof st.theme==='object'?st.theme:null,                             // older versions kept one shared look
        lgUsed=lg&&(lg.bg||(lg.tex&&lg.tex!=='none')||(lg.frame&&lg.frame!=='none')||lg.grad);
  st.chars=st.chars.filter(c=>c&&typeof c==='object').map(c=>({id:String(c.id||uid()),name:String(c.name||'Adventurer').slice(0,30),items:Array.isArray(c.items)?c.items:[],theme:cleanTheme(c.theme||(lgUsed?lg:null))}));
  if(!st.chars.length)st.chars=[{id:uid(),name:'Adventurer',items:[],theme:cleanTheme(null)}];
  if(!st.chars.some(c=>c.id===st.cur))st.cur=st.chars[0].id;
  return st;
}
const ST=loadState();let chars=ST.chars,curId=ST.cur;
const curChar=()=>chars.find(c=>c.id===curId);
let inv=curChar().items,theme=curChar().theme;
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify({chars,cur:curId}))}catch(e){}};

/* ---------- search (dnd5eapi.co) ---------- */
let timer,seq=0;
$('q').addEventListener('input',()=>{clearTimeout(timer);timer=setTimeout(search,300)});
async function search(){
  const v=$('q').value.trim(),my=++seq,r=$('res');
  if(!v){r.hidden=true;return}
  r.hidden=false;r.innerHTML='<div class="msg">Searching…</div>';
  let hits=[];
  try{
    const enc=encodeURIComponent(v);
    const [eq,mg]=await Promise.all([j(`${API}/api/2014/equipment?name=${enc}`),j(`${API}/api/2014/magic-items?name=${enc}`)]);
    hits=[...eq.results.map(x=>({...x,kind:'Equipment'})),...mg.results.map(x=>({...x,kind:'Magic item'}))].slice(0,10);
  }catch(e){if(my===seq)r.innerHTML='<div class="msg">Couldn’t reach dnd5eapi.co. Check your connection.</div>';return}
  if(my!==seq)return;
  r.innerHTML=hits.map(h=>`<div class="row" data-url="${esc(h.url)}" data-kind="${h.kind}"><b>${esc(h.name)}</b><small>${h.kind}</small></div>`).join('')
    +`<div class="row" data-custom="1"><span>Add “${esc(v)}” as a custom item</span></div>`;
}
$('res').addEventListener('click',async e=>{
  const row=e.target.closest('.row');if(!row)return;
  if(row.dataset.custom){addItem({id:'custom-'+$('q').value.trim().toLowerCase(),name:$('q').value.trim(),cat:'Custom',rows:[],desc:'',wt:0});return}
  row.innerHTML='<span>Loading…</span>';
  try{addItem(norm(await j(API+row.dataset.url),row.dataset.kind))}catch(err){row.innerHTML='<span>Failed to load item.</span>'}
});
document.addEventListener('click',e=>{if(!e.target.closest('.search'))$('res').hidden=true});

function norm(d,kind){
  const rows=[],add=(a,b)=>{if(b!==undefined&&b!==null&&b!=='')rows.push([a,String(b)])};
  add('Type',d.equipment_category?.name||kind);
  if(d.weapon_category)add('Category',`${d.weapon_category} ${d.weapon_range||''}`.trim());
  if(d.armor_category)add('Armor',d.armor_category);
  if(d.rarity)add('Rarity',d.rarity.name);
  if(d.damage)add('Damage',`${d.damage.damage_dice} ${(d.damage.damage_type?.name||'').toLowerCase()}`);
  if(d.two_handed_damage)add('Two-handed',`${d.two_handed_damage.damage_dice} ${(d.two_handed_damage.damage_type?.name||'').toLowerCase()}`);
  if(d.armor_class){const a=d.armor_class;add('Armor Class',`${a.base}${a.dex_bonus?' + Dex'+(a.max_bonus?` (max ${a.max_bonus})`:''):''}`)}
  if(d.range?.long)add('Range',`${d.range.normal}/${d.range.long} ft`);
  if(d.throw_range)add('Thrown',`${d.throw_range.normal}/${d.throw_range.long} ft`);
  if(d.str_minimum)add('Str required',d.str_minimum);
  if(d.stealth_disadvantage)add('Stealth','Disadvantage');
  if(d.properties?.length)add('Properties',d.properties.map(p=>p.name).join(', '));
  if(d.cost)add('Value',`${d.cost.quantity} ${d.cost.unit}`);
  if(d.weight)add('Weight',d.weight+' lb');
  return{id:d.index,name:d.name,cat:d.equipment_category?.name||kind,rows,desc:(d.desc||[]).join(' '),wt:d.weight||0,magic:kind==='Magic item'};
}

/* ---------- images (Openverse, Creative Commons only) ---------- */
const nm=it=>it.name.replace(/\s*\(.*?\)/g,'').trim();
const strip=h=>new DOMParser().parseFromString(h||'','text/html').body.textContent.trim();
const fname=t=>t.replace(/^File:/,'').replace(/\.\w{2,4}$/,'').replace(/_/g,' ');
const okMime=m=>/^image\/(jpeg|png|webp|svg\+xml|gif)$/.test(m||'');
const byIndex=d=>Object.values(d.query?.pages||{}).sort((a,b)=>a.index-b.index);

async function srcOpenverse(it){
  const q=encodeURIComponent(nm(it)),base='https://api.openverse.org/v1/images/?page_size=12&mature=false&q=';
  let d={results:[]};
  for(const u of [`${base}${q}%20fantasy&category=illustration&aspect_ratio=square`,`${base}${q}&category=illustration`,`${base}${q}`]){
    d=await j(u);if(d.results.length>=3)break;
  }
  return d.results.map(r=>({source:'Openverse (Creative Commons)',thumb:r.thumbnail||r.url,title:r.title||'Untitled',creator:r.creator||'Unknown',license:`CC ${(r.license||'').toUpperCase()} ${r.license_version||''}`.trim(),licenseUrl:r.license_url,landing:r.foreign_landing_url,ft:r.filetype,png:/^png$/i.test(r.filetype||'')}));
}
async function srcCommons(it){
  const q=encodeURIComponent(nm(it));
  const d=await j(`https://commons.wikimedia.org/w/api.php?action=query&format=json&origin=*&generator=search&gsrnamespace=6&gsrlimit=15&gsrsearch=${q}&prop=imageinfo&iiprop=url|mime|extmetadata&iiurlwidth=400`);

const catKey=it=>(it.cat||'').toLowerCase();
const CATGUTTER=46;   // margin reserved on a category's first row/column, for its little marker dot
// left-to-right, top-to-bottom shelf packing: each item keeps its own natural (weight-based) size, like free float does,
// just laid edge to edge instead of floating, wrapping to a new row once it runs out of width, grouped by category.
// One marker per category, centered on whichever row(s) that category ends up using.
function shelfPack(order,sizes,W,gp){
  const pos=new Array(order.length),markers=[];
  let x=0,y=gp,rowH=0,rowLeft=0,rowStartY=gp,rowIsNewCat=false,rowCatLabel=null,prevCat=null;
  const startRow=(isNewCat,label)=>{rowLeft=isNewCat?gp+CATGUTTER:gp;x=rowLeft;rowStartY=y;rowH=0;rowIsNewCat=isNewCat;rowCatLabel=label};
  const finalizeRow=()=>{if(rowIsNewCat)markers.push({cat:rowCatLabel,x:gp+CATGUTTER/2,y:rowStartY+rowH/2})};
  for(let i=0;i<order.length;i++){
    const{w,h}=sizes[i],cat=catKey(order[i]),label=order[i].cat||'Other';
    if(i===0){startRow(true,label)}
    else if(cat!==prevCat){finalizeRow();y+=rowH+gp*2.4;startRow(true,label)}
    else if(x>rowLeft&&x+w>W-gp){finalizeRow();y+=rowH+gp;startRow(false,null)}
    pos[i]={x:x+w/2,y:y+h/2};

    const r=b.el.getBoundingClientRect();
    if(px<r.left||px>r.right||py<r.top||py>r.bottom)continue;
    const it=inv.find(x=>x.id===b.id);if(!it)continue;
    const im=it.img,f=b.fl.getBoundingClientRect();

      const ar=im.r>0?im.r:f.width/f.height;

  if(k==='line')d=`<path d="${rrPath(m,m,W-2*m,H-2*m,r)}" stroke-width="2.4"/><path d="${rrPath(m+9,m+9,W-2*m-18,H-2*m-18,r-9)}" stroke-width="1"/>`;
  else if(k==='broken')d=`<path d="${rrPath(m,m,W-2*m,H-2*m,r)}" stroke-width="2.4" stroke-dasharray="420 18 70 18 240 18 26 18"/><path d="${rrPath(m+10,m+10,W-2*m-20,H-2*m-20,r-10)}" stroke-width="1.2" stroke-dasharray="2 9"/>`;
  else d=`<path d="${rrPath(m,m,W-2*m,H-2*m,r)}" stroke-width="2.2"/><path d="${wavyRR(m+13,m+13,W-2*m-26,H-2*m-26,r-12,3.2,13)}" stroke-width="1.5" stroke-dasharray="640 24 120 24"/>`;
  el.innerHTML=`<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" fill="none" stroke="${frameCol}" stroke-linecap="round" stroke-linejoin="round">${d}</svg>`;
}
function renderAppear(){
  const cur=(theme.bg||'').toLowerCase(),preset=SW.some(x=>x[0]===cur);
  const idx=chars.findIndex(c=>c.id===curId),prev=chars[(idx-1+chars.length)%chars.length],others=chars.filter(c=>c.id!==curId);
  const cp=others.length?`<div class="ap-row"><b>Copy design from</b><div class="cprow"><select id="cpsel">${others.map(c=>`<option value="${c.id}"${c.id===prev.id?' selected':''}>${esc(c.name)}</option>`).join('')}</select><button class="chip" id="cpbtn">Copy to ${esc(curChar().name)}</button></div></div>`:`<div class="ap-row"><b>Copy design from</b><div class="hint">Add another character to copy their design here.</div></div>`;
  $('appear').innerHTML=`<div class="hint" style="margin-bottom:8px">Design for <b>${esc(curChar().name)}</b></div><div class="ap-row"><b>Background color</b><div class="sw"><button class="swc${!cur?' on':''}" data-bg="" title="Default" style="background:linear-gradient(135deg,#f6f1e7 50%,#1c1712 50%)"></button>${SW.map(([c,n])=>`<button class="swc${cur===c?' on':''}" data-bg="${c}" title="${n} ${c}" style="background:${c}"></button>`).join('')}<label class="swc${cur&&!preset?' on':''}" title="Custom color" style="background:conic-gradient(red,yellow,lime,cyan,blue,magenta,red)"><input type="color" id="cc" value="${cur||'#f6f1e7'}"></label></div></div>
  <label class="ap-row tg"><input type="checkbox" id="gr"${theme.grad?' checked':''}> Soft gradient (lighter in the middle)</label>
  <div class="ap-row"><b>Texture</b><div class="chips">${Object.entries(TEXN).map(([k,n])=>`<button class="chip${theme.tex===k?' on':''}" data-tex="${k}">${n}</button>`).join('')}</div></div>
  <div class="ap-row"><b>Border</b><div class="chips">${Object.entries(FRN).map(([k,n])=>`<button class="chip${theme.frame===k?' on':''}" data-fr="${k}">${n}</button>`).join('')}</div></div>
  ${cp}
  <button class="chip" id="apreset">Reset appearance</button>`;
}
$('apb').onclick=()=>{const a=$('appear'),open=a.style.display==='block';a.style.display=open?'none':'block';if(!open)renderAppear()};
$('appear').addEventListener('click',e=>{
  const b=e.target.closest('[data-bg],[data-tex],[data-fr],#apreset,#cpbtn');if(!b)return;
  if(b.id==='cpbtn'){const src=chars.find(c=>c.id===$('cpsel').value);if(!src)return;Object.assign(theme,cleanTheme(src.theme));save();applyTheme();renderAppear();showMsg(`Copied ${esc(src.name)}’s design.`,2200);return}
  if(b.dataset.bg!==undefined)theme.bg=b.dataset.bg;
  else if(b.dataset.tex){theme.tex=b.dataset.tex;if(b.dataset.tex==='parchment')theme.bg='#e8dbb8'}
  else if(b.dataset.fr)theme.frame=b.dataset.fr;
  else Object.assign(theme,DEF_THEME);
  save();applyTheme();renderAppear();
});
$('appear').addEventListener('input',e=>{if(e.target.id==='cc'){theme.bg=e.target.value;save();applyTheme()}});
$('appear').addEventListener('change',e=>{if(e.target.id==='gr'){theme.grad=e.target.checked;save();applyTheme()}else if(e.target.id==='cc')renderAppear()});
document.addEventListener('click',e=>{if(!e.composedPath().some(n=>n.id==='appear'||n.id==='apb'))$('appear').style.display='none'});
matchMedia('(prefers-color-scheme:dark)').addEventListener('change',applyTheme);
let rt;addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(()=>{renderGrid();drawFrame();cardSide=null;showDetail()},150)});addEventListener('keydown',e=>{
  if((e.ctrlKey||e.metaKey)&&!e.altKey&&e.key.toLowerCase()==='z'){
    const t=document.activeElement,typing=t&&(t.tagName==='INPUT'||t.tagName==='TEXTAREA');
    if(!typing){e.preventDefault();e.shiftKey?doRedo():doUndo()}return;
  }
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='y'){
    const t=document.activeElement,typing=t&&(t.tagName==='INPUT'||t.tagName==='TEXTAREA');
    if(!typing){e.preventDefault();doRedo()}return;
  }
  if(e.key!=='Escape')return;if(chOpen){setChMenu(false)}else if($('appear').style.display==='block'){$('appear').style.display='none'}else if(pickOpen){pickOpen=false;showModal()}else if(sel!==null){sel=null;render()}});
applyTheme();updateTitle();renderRail();updateUndoUI();updateSortUI();render();
inv.forEach(it=>{if(it.img)prep(it)});
</script>
